name: Dependabot Auto Merge

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] no PR code is checked out or executed
    workflows:
      - Deploy to GitHub Pages
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Merge successful Dependabot update
        run: |
          pr_number=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" \
            --jq 'map(select(.user.login == "dependabot[bot]" and .state == "open")) | first | .number // empty')

          if [[ -z "$pr_number" ]]; then
            echo "No open Dependabot PR found for $HEAD_SHA."
            exit 0
          fi

          current_head=$(gh pr view "$pr_number" --repo "$REPOSITORY" \
            --json headRefOid --jq '.headRefOid')

          if [[ "$current_head" != "$HEAD_SHA" ]]; then
            echo "Dependabot PR #$pr_number changed after CI started; waiting for the next run."
            exit 0
          fi

          gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
